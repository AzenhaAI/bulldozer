name: Update data

# Parses public sources (IMF, surveys) on a schedule and commits any changes.
# Mirrors the Madeira Ativa GitHub Actions parser pipeline.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Parsers read curated tidy sources (IMF WEO, Gapminder, WHR). When those
      # local/curated files aren't present in CI, the parsers soft-skip — so this
      # job is a no-op unless run on a runner that has the sources mounted.
      # Day-to-day, run `npm run data:build` locally and commit the output.
      #
      # continue-on-error so that one unreachable upstream doesn't discard the
      # refreshes that DID succeed — they still get committed below, and the
      # job is failed at the end instead. Datasets are never left half-written:
      # scripts/lib/guard.mjs refuses any write that looks broken.
      - name: Rebuild datasets from sources
        id: parse
        continue-on-error: true
        run: npm run data:build

      - name: Commit updated datasets
        run: |
          git config user.name "bulldozer-bot"
          git config user.email "agent@azenha.ai"
          if [[ -n "$(git status --porcelain src/data)" ]]; then
            git add src/data
            git commit -m "data: refresh from public sources [skip ci]"
            git push
          else
            echo "No data changes."
          fi

      # Surface the failure only after the good data is safely committed.
      - name: Fail if any parser failed
        if: steps.parse.outcome == 'failure'
        run: |
          echo "One or more parsers failed — see the summary in the Rebuild step."
          exit 1
